swagger: '2.0'
info:
  title: Teradata MCP Server - Google Cloud Run
  description: >-
    Teradata MCP Community Server deployed on Google Cloud Run via streamable HTTP.
    Provides tools for querying Teradata VantageCloud databases including
    retail analytics, RFM customer segmentation, data quality, and more.
  version: 1.0.0
host: teradata-mcp-server-qjbnwc2nma-uc.a.run.app
basePath: /
schemes:
  - https
consumes: []
produces: []
paths:
  /mcp/:
    post:
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: TeradataMCP
      consumes:
        - application/json
      produces:
        - application/json
        - text/event-stream
      parameters:
        - in: header
          name: Accept
          required: true
          type: string
          default: application/json, text/event-stream
          x-ms-visibility: internal
        - in: header
          name: Content-Type
          required: true
          type: string
          default: application/json
          x-ms-visibility: internal
      responses:
        '200':
          description: Success
securityDefinitions:
  basicAuth:
    type: basic
    description: >-
      Teradata username and password. Credentials are validated directly
      against the Teradata Vantage database. Use the same user and password
      you would use to connect to Teradata.
security:
  - basicAuth: []
